version: '3.8'

services:
  django:
    image: my-django-app  # Replace with your Docker image name
    ports:
      - "8000:8000"       # Exposes port 8000 on the host and container
    environment:
      - DEBUG=True        # Optionally set environment variables if needed
    volumes:
      - .:/app            # Optional: mount current directory to /app inside the container (useful for development)

